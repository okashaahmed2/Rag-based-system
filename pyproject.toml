[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Local-first RAG document intelligence and knowledge extraction pipeline."
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2,<3",
    "numpy>=2,<3",
    "pymupdf>=2.1,<3",
    "sentence-transformers>=6.3,<7",
    "chromadb>=1.5,<2",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
